name: CI

on:
  pull_request:
  # the deploy workflow calls this on push to primary rather than the two
  # triggering separately, so the gates are defined once and run once
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci
      - run: npm --prefix tools/lint ci
      # the split only holds while the lint toolchain resolves TypeScript 6;
      # a hoist to the root's 7 breaks linting in confusing ways
      - name: Assert the lint toolchain's TypeScript
        run: node -p "require('./tools/lint/node_modules/typescript/package.json').version" | grep -q '^6\.'
      - run: npm run lint
      - run: npm run typecheck
      # eslint carries prettier over the TypeScript it lints, so this covers
      # everything the lint run does not reach: the markdown, YAML and JSON,
      # the HTML entry point, and the eslint configs themselves
      - run: npm run format

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
