# Publishes to the gh-pages branch, which GitHub Pages serves.
#
# Deploying from a branch rather than actions/deploy-pages is what makes PR
# previews possible: Pages allows one deployment per repository, so production
# lives at the root of that branch and previews live under pr-<N>/ beside it.
name: Deploy to GH Pages

on:
  push:
    branches: ["primary"]
  workflow_dispatch:

permissions:
  contents: write

# shared with pr-preview.yml so publishes to the branch serialise
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm --prefix tools/lint ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - run: ./scripts/gh-pages.sh publish dist .
