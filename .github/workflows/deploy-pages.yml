# Publishes to the gh-pages branch, which GitHub Pages serves.
#
# PR previews are only possible because this deploys from a branch instead of
# through actions/deploy-pages: Pages allows one deployment per repository, so
# production lives at the root of that branch and previews live under pr-<N>/
# beside it.
name: Deploy to GH Pages

on:
  push:
    branches: ["primary"]
  workflow_dispatch:

permissions:
  contents: write

# shared with pr-preview.yml so publishes to the branch serialise
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  # the same gates a pull request faces, called rather than copied: a second
  # hand-maintained list is one that drifts, and the deploy path is the worst
  # place to discover it has
  checks:
    uses: ./.github/workflows/ci.yml

  # the ref guard is on the job, not the trigger: workflow_dispatch takes a ref
  # of the caller's choosing, and publishing replaces the whole site root
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/primary'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: ./scripts/gh-pages.sh publish dist .
